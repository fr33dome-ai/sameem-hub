# =============================================================================
# Sameem Hub — Netlify production configuration (v1.7.1 simplified)
# =============================================================================
# Stack:   Next.js 14 (frontend) only for this deploy.
#          /backend (Express + Prisma) lives in the repo and will be wired up
#          as Netlify Functions in the next iteration once DATABASE_URL is
#          provisioned (Neon recommended).
# Routes:  /            → Next.js
#          /classic     → frozen v1.7 single-file dashboard (no backend)
# =============================================================================

[build]
  base    = "."
  command = "npm run netlify:build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION  = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  CI = "true"

# Next.js runtime auto-detect
[[plugins]]
  package = "@netlify/plugin-nextjs"

# v1.7 dashboard at /classic
[[redirects]]
  from   = "/classic"
  to     = "/classic.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache the frozen v1.7 dashboard
[[headers]]
  for = "/classic.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[dev]
  command   = "npm --prefix frontend run dev"
  port      = 8888
  targetPort = 3000
  publish   = "frontend/.next"
  framework = "next"
