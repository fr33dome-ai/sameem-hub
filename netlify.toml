# =============================================================================
# Sameem Hub — Netlify configuration (v1.8)
# =============================================================================
# Routes:
#   /            → Next.js landing page
#   /classic     → frozen v1.7 dashboard (now cloud-synced via /api/v1/state)
#   /api/v1/*    → Express API as a Netlify Function
# =============================================================================

[build]
  base      = "."
  command   = "npm run netlify:build"
  publish   = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION            = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  CI                      = "true"
  # Prisma needs this to emit an engine that runs on Netlify's Lambda image.
  PRISMA_CLI_BINARY_TARGETS = "native,rhel-openssl-3.0.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# API — pretty path in front of the function
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# v1.7 dashboard
[[redirects]]
  from   = "/classic"
  to     = "/classic.html"
  status = 200

# ---------------------------------------------------------------------------
# Functions runtime
# ---------------------------------------------------------------------------
[functions]
  node_bundler          = "esbuild"
  # Prisma's query engine is a binary — esbuild must not try to inline it.
  external_node_modules = ["@prisma/client", ".prisma/client"]
  # The client is generated into backend/node_modules (we install with
  # --prefix backend), so both locations are included.
  included_files = [
    "backend/prisma/**",
    "backend/node_modules/.prisma/**",
    "backend/node_modules/@prisma/client/**",
    "node_modules/.prisma/**"
  ]

[functions.api]
  timeout = 26

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

# The dashboard is now cloud-synced, so it must NOT be cached aggressively —
# otherwise a stale copy keeps talking to the API with old code.
[[headers]]
  for = "/classic.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[dev]
  command    = "npm --prefix frontend run dev"
  port       = 8888
  targetPort = 3000
  publish    = "frontend/.next"
  framework  = "next"
