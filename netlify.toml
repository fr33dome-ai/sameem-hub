# =============================================================================
# Sameem Hub — Netlify configuration (v1.8)
# =============================================================================
# Routes:
#   /              → Next.js landing page
#   /dashboard     → Sameem Hub dashboard (cloud-synced)
#   /classic       → same dashboard (legacy path, kept for old links)
#   /api/v1/*      → Express API as a Netlify Function
# =============================================================================

[build]
  base      = "."
  command   = "npm run netlify:build"
  publish   = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION            = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  CI                      = "true"
  # NOTE: Prisma binary targets are declared in backend/prisma/schema.prisma
  # (generator.binaryTargets), NOT here. Setting PRISMA_CLI_BINARY_TARGETS as
  # an env var makes `prisma generate` fail with "Unknown binaryTarget native".

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# API — pretty path in front of the function
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# ---------------------------------------------------------------------------
# Dashboard routing
# The file is Sameem-Hub.html. Friendly paths point at it, and the old
# /classic path is kept so existing links and bookmarks keep working.
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/dashboard"
  to     = "/Sameem-Hub.html"
  status = 200

[[redirects]]
  from   = "/classic"
  to     = "/Sameem-Hub.html"
  status = 200

[[redirects]]
  from   = "/classic.html"
  to     = "/Sameem-Hub.html"
  status = 301

# ---------------------------------------------------------------------------
# Functions runtime
# ---------------------------------------------------------------------------
[functions]
  node_bundler          = "esbuild"
  # Prisma's query engine is a binary — esbuild must not try to inline it.
  external_node_modules = ["@prisma/client", ".prisma/client"]
  # @prisma/client is external (not bundled), so the real files must ship with
  # the function. The build generates the client into ROOT node_modules via
  # `prisma generate --schema backend/prisma/schema.prisma`.
  included_files = [
    "backend/prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**"
  ]

[functions.api]
  timeout = 26

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

# The dashboard is cloud-synced, so it must NOT be cached aggressively —
# otherwise a stale copy keeps talking to the API with old code.
[[headers]]
  for = "/Sameem-Hub.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[dev]
  command    = "npm --prefix frontend run dev"
  port       = 8888
  targetPort = 3000
  publish    = "frontend/.next"
  framework  = "next"
